spring.application.name=WeatherApiService
spring.datasource.url=jdbc:postgresql://localhost:5432/weatherdb
spring.datasource.username=weather_local
spring.datasource.password=weather_local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Path to the IP2Location database (relative to the repo root, where the app is started)
ip2location.db-path=/ip2locdb/IP2LOCATION-LITE-DB3.BIN
